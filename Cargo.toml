[package]
name = "opendeck-ss550"
version = "1.0.3"
edition = "2024"

[dependencies]
data-url = "0.3.2"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg"] }
log = "0.4.29"
mirajazz = "0.14.0"
openaction = "2.6.0"
sha1 = "0.11.0"
simplelog = "0.12.2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }